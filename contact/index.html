<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Bannerfield</title>
<meta name="theme-color" content="#15111c">
<link rel="alternate" hreflang="en" href="https://konradschade.github.io/bannerfield/contact/">
<link rel="alternate" hreflang="de" href="https://konradschade.github.io/bannerfield/kontakt/">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../icon.png">
<style>
form { display: grid; gap: 14px; margin-top: 16px; }
label { display: grid; gap: 4px; font-size: 0.95rem; }
input, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
textarea { min-height: 160px; resize: vertical; }
button { justify-self: start; font: inherit; padding: 10px 22px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
.hint { color: var(--muted); font-size: 0.9rem; }
#status { min-height: 1.6em; }
.trap { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <a class="back" href="../">← Bannerfield</a>
    <nav class="lang" aria-label="Language">
      <a href="./" lang="en" aria-current="page">EN</a>|<a href="../kontakt/" lang="de" hreflang="de">DE</a>
    </nav>
  </header>
  <h1>Contact</h1>
  <p>Write to me directly. I usually reply within one or two days to the email address you enter.
  You can also email <a href="mailto:konradschade1@gmail.com">konradschade1@gmail.com</a>.</p>
  <form id="f">
    <label>Name (optional)<input id="name" name="name" autocomplete="name" maxlength="80"></label>
    <label>Your email address for the reply<input id="mail" name="mail" type="email" required autocomplete="email" maxlength="120"></label>
    <label>Message<textarea id="msg" name="msg" required maxlength="3000"></textarea></label>
    <input class="trap" id="web" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="hint">Your details are sent to me encrypted and used only to reply to you
    (see the <a href="../datenschutz/">privacy policy</a>, in German).</p>
    <button id="send" type="submit">Send</button>
    <p id="status" role="status"></p>
  </form>
  <footer>
    <nav aria-label="Footer">
      <a href="../">Home</a><a href="../support/">Support</a><a href="../datenschutz/">Privacy</a><a href="../impressum/">Imprint</a>
    </nav>
  </footer>
</main>
<script>
const f = document.getElementById("f"), st = document.getElementById("status"), btn = document.getElementById("send");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (document.getElementById("web").value) return;  // Spam-Falle
  const name = document.getElementById("name").value.trim();
  const mail = document.getElementById("mail").value.trim();
  const msg = document.getElementById("msg").value.trim();
  if (!mail || !msg) { st.textContent = "Please enter your email address and a message."; return; }
  btn.disabled = true; st.textContent = "Sending …";
  try {
    const r = await fetch("https://ntfy.sh/bannerfield-fb-828cbc5eca8b1c7e", {
      method: "POST",
      headers: { "Title": "Website-Kontakt (EN)", "Tags": "envelope" },
      body: "Von: " + (name || "(ohne Name)") + " <" + mail + ">\n\n" + msg
    });
    if (!r.ok) throw new Error(r.status);
    f.reset(); st.textContent = "Thank you, your message has arrived.";
  } catch (err) {
    st.textContent = "Sending failed. Please email me at konradschade1@gmail.com.";
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
